<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Latha",sans-serif;min-height:100%}

.seg{display:flex;background:var(--bg4);border-radius:12px;padding:4px;gap:4px}

.seg button.on{background:var(--bg2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--b1)}

.sw{width:50px;height:30px;border-radius:15px;background:var(--bg4);border:1px solid var(--b2);position:relative;flex:0 0 50px;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text3);transition:transform .25s var(--ease),background .2s}
.sw.on{background:color-mix(in srgb,var(--mint) 40%,var(--bg4))}.sw.on::after{transform:translateX(20px);background:var(--mint)}

.pad button:active{transform:scale(.93);background:var(--bg4)}
.pad button.k{font-size:14px;font-weight:800;color:var(--text3)}
.msg{min-height:20px;font-size:13.5px;font-weight:700;color:var(--coral);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;transition:all .3s var(--ease);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--b2);border-top-color:var(--cyan);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="lock">

  <h1 id="lk-t">BuildLedger Owner</h1>
  <p id="lk-p">Enter your owner PIN</p>
  <div class="dots" id="dots"></div>
  <div class="msg" id="lk-msg"></div>
  <div class="pad" id="pad"></div>
  <button class="btn" id="lk-bio" style="margin-top:6px" hidden>👆 <span id="lk-bio-t">Use fingerprint</span></button>
</div>

<header class="top hide" id="top">

  <button class="ib" id="b-al" aria-label="Alerts">🔔<em id="al-n" hidden></em></button>

<div class="offline hide" id="offline"></div>
<main id="main">

  <section class="view" id="v-sites"></section>

function fd(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); if(!m) return iso || '—'; return +m[3] + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2] - 1]; }
function ago(ms){ var m = Math.round((Date.now() - ms) / 60000); if(LANG === 'ta') return m < 1 ? 'இப்போது' : m < 60 ? m + ' நிமிடம் முன்' : m < 1440 ? Math.round(m / 60) + ' மணி முன்' : Math.round(m / 1440) + ' நாள் முன்'; return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; }

/* ── crypto (matches BuildLedger) ──────────────────────────────────── */
function b64u(bytes){ var s = '', a = new Uint8Array(bytes); for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64u(str){ str = String(str).replace(/-/g, '+').replace(/_/g, '/'); while(str.length % 4) str += '='; var s = atob(str), a = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function rand(n){ var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
function deriveKey(pin){
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pin), {name:'PBKDF2'}, false, ['deriveBits'])
    .then(function(k){ return crypto.subtle.deriveBits({name:'PBKDF2', salt:unb64u(CFG.salt), iterations:ITER, hash:'SHA-256'}, k, 256); })
    .then(function(bits){ return crypto.subtle.importKey('raw', bits, {name:'AES-GCM'}, false, ['encrypt', 'decrypt']); });
}
function openBlob(blob, key){ var all = unb64u(String(blob).trim()); return crypto.subtle.decrypt({name:'AES-GCM', iv:all.slice(0, 12)}, key, all.slice(12)).then(function(pt){ return JSON.parse(new TextDecoder().decode(pt)); }); }
function sealObj(obj, key){ var iv = rand(12); return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){ var c = new Uint8Array(ct), o = new Uint8Array(12 + c.length); o.set(iv, 0); o.set(c, 12); return b64u(o); }); }

/* ── a small key store the alerts helper can read too ─────────────── */
function idb(){ return new Promise(function(ok, no){ if(!window.indexedDB) return no(new Error('no idb')); var r = indexedDB.open('bl-owner', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); }; r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ no(r.error); }; }); }
function kvGet(k){ return idb().then(function(db){ return new Promise(function(ok){ var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function(){ ok(q.result); }; q.onerror = function(){ ok(null); }; }); }).catch(function(){ return null; }); }
function kvSet(k, v){ return idb().then(function(db){ return new Promise(function(ok){ var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }); }).catch(function(){ return false; }); }
function kvClear(){ return idb().then(function(db){ return new Promise(function(ok){ var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = function(){ ok(true); }; }); }).catch(function(){}); }

/* ── where the summary lives ───────────────────────────────────────── */
function readLink(){
  var m = /[#&]o=([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if(m){
    var url = ''; try{ url = new TextDecoder().decode(unb64u(m[4])); }catch(e){}
    if(/^https:\/\/[^\s/]+/.test(url) || /^http:\/\/(localhost|127\.)/.test(url)){
      var c = {id:m[1], inbox:m[2], salt:m[3], url:url.replace(/\/+$/, '')}, old = LS.get('blo_cfg');
      if(!old || old.id !== c.id || old.salt !== c.salt){ LS.del('blo_blob'); LS.del('blo_bio'); kvClear(); }
      LS.set('blo_cfg', c);
      try{ history.replaceState(null, '', location.pathname); }catch(e){}
    }
  }
  CFG = LS.get('blo_cfg');
  if(CFG) kvSet('cfg', CFG);
}
function fetchBlob(){
  return fetch(CFG.url + '/p/' + CFG.id, {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){ LS.set('blo_blob', {b:t, at:Date.now()}); return {b:t, live:true}; })
    .catch(function(){ var c = LS.get('blo_blob'); if(c && c.b) return {b:c.b, live:false}; throw new Error('offline'); });
}

/* ── lock screen ───────────────────────────────────────────────────── */
var PIN = '', fails = LS.get('blo_fails') || {n:0, until:0};
function padBuild(){
  var keys = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
  $('pad').innerHTML = keys.map(function(k){ return '<button type="button" data-k="' + k + '"' + (k === '⌫' || k === 'OK' ? ' class="k"' : '') + '>' + k + '</button>'; }).join('');
  $('pad').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; press(b.getAttribute('data-k')); };
  document.addEventListener('keydown', function(e){ if($('lock').classList.contains('hide')) return; if(/^\d$/.test(e.key)) press(e.key); else if(e.key === 'Backspace') press('⌫'); else if(e.key === 'Enter') press('OK'); });
  dots();
}
function dots(){ var n = Math.max(6, PIN.length); $('dots').innerHTML = Array.from({length:n}, function(_, i){ return '<i class="' + (i < PIN.length ? 'f' : '') + '"></i>'; }).join(''); }
function press(k){
  if(Date.now() < fails.until){ $('lk-msg').textContent = L('wait') + ' ' + Math.ceil((fails.until - Date.now()) / 1000) + 's'; return; }
  if(k === '⌫'){ PIN = PIN.slice(0, -1); dots(); return; }
  if(k === 'OK'){ if(PIN.length >= 6) tryPin(); return; }
  if(PIN.length < 12){ PIN += k; dots(); $('lk-msg').textContent = ''; }
}
function tryPin(){
  var pin = PIN; $('lk-msg').innerHTML = '<span class="spin"></span>';
  var keyP = deriveKey(pin);
  Promise.all([keyP, fetchBlob()]).then(function(r){ return openBlob(r[1].b, r[0]).then(function(snap){ return {key:r[0], snap:snap, live:r[1].live}; }); })
    .then(function(x){
      fails = {n:0, until:0}; LS.set('blo_fails', fails); PIN = ''; dots();
      KEY = x.key; kvSet('key', KEY);
      show(x.snap, x.live);
    }, function(e){
      PIN = ''; dots();
      if(e && e.message === 'offline'){ $('lk-msg').textContent = 'No connection and no saved copy yet.'; return; }
      fails.n++; if(fails.n >= 5){ fails.until = Date.now() + 30000 * Math.pow(2, Math.min(4, fails.n - 5)); }
      LS.set('blo_fails', fails);
      $('lk-msg').textContent = L('wrong'); $('dots').classList.remove('shake'); void $('dots').offsetWidth; $('dots').classList.add('shake');
    });
}
function lock(){ KEY = null; SNAP = null; ['top', 'nav', 'fab'].forEach(function(id){ $(id).classList.add('hide'); }); $('main').classList.add('hide'); $('lock').classList.remove('hide'); PIN = ''; dots(); bioButton(); }

/* ── 11 · fingerprint / face: the phone's own lock guards the saved key ─ */
function bioOk(){ return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext); }
function bioButton(){ var b = LS.get('blo_bio'); $('lk-bio').hidden = !(b && bioOk()); $('lk-bio-t').textContent = L('bio'); }
function bioRegister(){
  if(!bioOk()) return Promise.reject(new Error('This phone or browser cannot use fingerprint here.'));
  return navigator.credentials.create({publicKey:{challenge:rand(32), rp:{name:'BuildLedger Owner'}, user:{id:rand(16), name:'owner', displayName:'Owner'},
    pubKeyCredParams:[{type:'public-key', alg:-7}, {type:'public-key', alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'}, timeout:60000}})
    .then(function(c){ LS.set('blo_bio', {id:b64u(c.rawId)}); return true; });
}
function bioUnlock(){
  var b = LS.get('blo_bio'); if(!b) return;
  navigator.credentials.get({publicKey:{challenge:rand(32), allowCredentials:[{type:'public-key', id:unb64u(b.id)}], userVerification:'required', timeout:60000}})
    .then(function(){ return kvGet('key'); })
    .then(function(k){ if(!k) throw new Error('Enter your PIN once on this phone first.'); KEY = k; return fetchBlob().then(function(r){ return openBlob(r.b, k).then(function(s){ show(s, r.live); }); }); })
    .catch(function(e){ $('lk-msg').textContent = e && e.message && !/abort|NotAllowed/i.test(e.name + e.message) ? e.message : ''; });
}

  if(flushing) return flushing;
  var o = outbox(); if(!o.length || !SNAP || !KEY) return Promise.resolve(true);
  var mb = SNAP.mb || {}; if(!mb.sk || !mb.u || !mb.box) return Promise.resolve(false);
  flushing = fetch(mb.u + '/p/' + mb.box, {cache:'no-store'}).then(function(r){ if(r.status === 404) return null; if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){ return t && t !== 'test' ? openBlob(t, KEY).catch(function(){ return {msgs:[]}; }) : {msgs:[]}; })
    .then(function(box){
      var acks = {}; (SNAP.acks || []).forEach(function(a){ acks[a] = 1; });
      var have = {}, msgs = (box.msgs || []).filter(function(m){ return m && !acks[m.id]; });
      msgs.forEach(function(m){ have[m.id] = 1; });
      o.forEach(function(m){ if(!have[m.id]) msgs.push(m); });
      return sealObj({msgs:msgs.slice(-200)}, KEY);
    }).then(function(blob){ return fetch(mb.u + '/p/' + mb.box, {method:'PUT', headers:{'content-type':'text/plain', 'x-pb-key':mb.sk}, body:blob}); })
    .then(function(r){ flushing = null; if(!r.ok) throw new Error('HTTP ' + r.status); LS.set('blo_out', outbox().filter(function(m){ return !o.some(function(x){ return x.id === m.id; }); })); return true; })
    .catch(function(){ flushing = null; return false; });
  return flushing;
}
function pruneSent(){ var keep = LS.get('blo_sent') || {}; SENT = {}; Object.keys(keep).forEach(function(k){ if(Date.now() - keep[k].at < 3 * 864e5 && (!/^q/.test(k) || (SNAP.queue || []).some(function(x){ return 'q' + x.id === k; }))) SENT[k] = keep[k].t; }); }
function mark(k, text){ SENT[k] = text; var keep = LS.get('blo_sent') || {}; keep[k] = {t:text, at:Date.now()}; LS.set('blo_sent', keep); }
function wa(phone, text){ var p = String(phone || '').replace(/\D/g, ''); if(p.length === 10) p = '91' + p; window.open('https://wa.me/' + p + '?text=' + encodeURIComponent(text), '_blank'); }

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-wa]');
  if(b){ var x = (SNAP.owed || []).filter(function(y){ return String(y.cid) === b.getAttribute('data-wa'); })[0]; if(!x) return; wa(x.ph, x.msg);
    var q = (SNAP.queue || []).filter(function(y){ return y.jt === 'chase' && y.k === 'wa' && y.ph === x.ph; })[0];
    if(q){ send({type:'approve', qid:q.id, how:'sent'}); mark('q' + q.id, L('sent')); }
    mark('w' + x.cid, 'sent'); money(); approvals(); badges(); return; }
  var a = e.target.closest('[data-q]');
  if(a){ var id = Number(a.getAttribute('data-q')), how = a.getAttribute('data-how'), it = (SNAP.queue || []).filter(function(y){ return y.id === id; })[0]; if(!it) return;
    if(how === 'wa'){ wa(it.ph, it.msg); send({type:'approve', qid:id, how:'sent'}); mark('q' + id, L('sent')); }
    else if(how === 'do'){ send({type:'approve', qid:id, how:'do'}); mark('q' + id, L('appr')); }
    else { send({type:'approve', qid:id, how:'skip'}); mark('q' + id, '⏭ ' + L('skip')); }
    approvals(); badges(); toast('📨 ' + (LANG === 'ta' ? 'கணினிக்கு அனுப்பப்பட்டது' : 'Sent to your computer')); return; }
  var n = e.target.closest('nav button'); if(n){ go(n.getAttribute('data-v')); return; }
});

/* ── 10 · quick entry ──────────────────────────────────────────────── */
var ENT = {kind:'exp'};
function sheet(id, on){ $(id).classList.toggle('on', on); $('veil').classList.toggle('on', on || !!document.querySelector('.sheet.on')); }
$('veil').onclick = function(){ [].forEach.call(document.querySelectorAll('.sheet.on'), function(s){ s.classList.remove('on'); }); $('veil').classList.remove('on'); };
function entrySheet(){
  var cs = SNAP.cust || [], today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $('sh-entry').innerHTML = '<div class="grab"></div><h3>＋ ' + esc(L('entry')) + '</h3>'
    + '<div class="seg" id="en-k"><button data-k="exp" class="' + (ENT.kind === 'exp' ? 'on' : '') + '">💸 ' + esc(L('spent')) + '</button><button data-k="rec" class="' + (ENT.kind === 'rec' ? 'on' : '') + '">💰 ' + esc(L('got')) + '</button></div>'
    + '<div class="field" style="margin-top:14px"><label>' + esc(L('amt')) + '</label><input id="en-amt" type="number" inputmode="decimal" min="1" step="any" placeholder="0"></div>'
    + '<div class="field"><label>' + esc(L('proj1')) + '</label><select id="en-c">' + (ENT.kind === 'exp' ? '<option value="">' + esc(L('company')) + '</option>' : '') + cs.map(function(c){ return '<option value="' + c.id + '">' + esc(c.n) + '</option>'; }).join('') + '</select></div>'
    + (ENT.kind === 'rec' ? '<div class="field"><label>' + esc(L('against')) + '</label><select id="en-s"></select></div>' : '')
    + '<div class="field"><label>' + esc(L('mode')) + '</label><div class="seg" id="en-m">' + ['Cash', 'GPay', 'Bank Transfer', 'Cheque'].map(function(m, i){ return '<button data-m="' + m + '" class="' + (i ? '' : 'on') + '">' + m.replace('Bank Transfer', 'Bank') + '</button>'; }).join('') + '</div></div>'
    + '<div class="field"><label>' + esc(L('note')) + '</label><input id="en-n" maxlength="120" placeholder="' + (ENT.kind === 'exp' ? 'Cement 50 bags' : 'Stage 3') + '"></div>'
    + '<div class="field"><label>' + esc(L('date')) + '</label><input id="en-d" type="date" value="' + today + '"></div>'
    + '<button class="btn pri" id="en-go" style="width:100%;height:50px;margin-top:6px">📨 ' + esc(L('send')) + '</button>'
    + '<p style="color:var(--text3);font-size:12.5px;margin-top:10px;text-align:center">' + (LANG === 'ta' ? 'கணினியில் மேஸ்திரி ஏஜென்டில் அனுமதித்ததும் கணக்கில் சேரும்.' : 'It goes into the books once you approve it in Mestri Agent on your computer.') + '</p>';
  $('en-k').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; ENT.kind = b.getAttribute('data-k'); entrySheet(); };
  $('en-m').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; [].forEach.call($('en-m').children, function(x){ x.classList.toggle('on', x === b); }); };
  function stages(){ var s = $('en-s'); if(!s) return; var c = (SNAP.stages || []).filter(function(x){ return String(x.cid) === $('en-c').value; })[0]; s.innerHTML = '<option value="">' + esc(L('general')) + '</option>' + (c ? c.s.filter(function(x){ return x.a - x.got > 0.5; }).map(function(x){ return '<option value="' + x.id + '">' + esc(x.n) + ' — ' + rs(x.a - x.got) + '</option>'; }).join('') : ''); if(s.options.length > 1) s.selectedIndex = 1; }
  $('en-c').onchange = stages; stages();
  $('en-go').onclick = function(){
    var amt = Number($('en-amt').value); if(!(amt > 0)){ $('en-amt').focus(); return; }
    var m = document.querySelector('#en-m .on');
    send({type:'entry', kind:ENT.kind, amt:amt, cid:$('en-c').value ? Number($('en-c').value) : null, sid:$('en-s') && $('en-s').value ? Number($('en-s').value) : null, mode:m ? m.getAttribute('data-m') : 'Cash', note:$('en-n').value.trim(), date:$('en-d').value});
    sheet('sh-entry', false); toast('📨 ' + L('queued'));
  };
  sheet('sh-entry', true); setTimeout(function(){ $('en-amt').focus(); }, 300);
}
$('fab').onclick = function(){ ENT.kind = 'exp'; entrySheet(); };

/* ── settings: language, theme, fingerprint, alerts, lock ──────────── */
function setSheet(){
  var th = LS.get('blo_theme') || 'auto', bio = !!LS.get('blo_bio'), lockOn = LS.get('blo_lock') !== false, notif = !!LS.get('blo_push');
  $('sh-set').innerHTML = '<div class="grab"></div><h3>⚙ ' + esc(L('set')) + '</h3>'
    + '<div class="field"><label>' + esc(L('lang')) + '</label><div class="seg" id="st-l"><button data-v="en" class="' + (LANG === 'en' ? 'on' : '') + '">English</button><button data-v="ta" class="' + (LANG === 'ta' ? 'on' : '') + '">தமிழ்</button></div></div>'
    + '<div class="field"><label>' + esc(L('theme')) + '</label><div class="seg" id="st-t">' + [['auto', 'Auto'], ['dark', '🌙'], ['light', '☀️']].map(function(x){ return '<button data-v="' + x[0] + '" class="' + (th === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div></div>'
    + '<div class="opt"><span>👆 ' + esc(L('bio')) + '<small>' + (bioOk() ? (LANG === 'ta' ? 'PIN இல்லாமல் திறக்க' : 'Open without typing the PIN') : 'Needs the page on https and a phone with a fingerprint or face lock') + '</small></span><button class="sw' + (bio ? ' on' : '') + '" id="st-bio"></button></div>'
    + '<div class="opt"><span>🔔 ' + esc(L('notif')) + '<small>' + ('PushManager' in window ? (LANG === 'ta' ? 'பணம் வந்தால், தவணை முடிந்தால்…' : 'Money received, stage paid, over budget, approvals') : 'Add this page to your home screen first') + '</small></span><button class="sw' + (notif ? ' on' : '') + '" id="st-n"></button></div>'
    + '<div class="opt"><span>🔐 ' + esc(L('lockopt')) + '<small>' + (LANG === 'ta' ? '5 நிமிடத்திற்கு மேல் மூடினால்' : 'After 5 minutes away') + '</small></span><button class="sw' + (lockOn ? ' on' : '') + '" id="st-lk"></button></div>'
    + '<div class="btns" style="margin-top:16px"><button class="btn" id="st-now">🔒 ' + esc(L('lockn')) + '</button><button class="btn" id="st-forget" style="color:var(--coral)">' + esc(L('forget')) + '</button></div>';
  $('st-l').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; LANG = b.getAttribute('data-v'); LS.set('blo_lang', LANG); show(SNAP, $('offline').classList.contains('hide')); setSheet(); };
  $('st-t').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; LS.set('blo_theme', b.getAttribute('data-v')); theme(); setSheet(); };
  $('st-bio').onclick = function(){ if(LS.get('blo_bio')){ LS.del('blo_bio'); setSheet(); return; } bioRegister().then(function(){ toast('👆 ' + (LANG === 'ta' ? 'விரல்ரேகை தயார்' : 'Fingerprint unlock is on')); setSheet(); }, function(e){ toast(e && e.message ? e.message : 'Could not set up'); }); };
  $('st-n').onclick = function(){ if(LS.get('blo_push')) pushOff().then(setSheet); else pushOn().then(setSheet); };
  $('st-lk').onclick = function(){ LS.set('blo_lock', LS.get('blo_lock') === false); setSheet(); };
  $('st-now').onclick = function(){ sheet('sh-set', false); lock(); };
  $('st-forget').onclick = function(){ if(!confirm(LANG === 'ta' ? 'இந்த தொலைபேசியிலிருந்து அனைத்தையும் நீக்கவா?' : 'Remove everything from this phone? You will need the link and PIN again.')) return; pushOff(); ['blo_cfg', 'blo_blob', 'blo_bio', 'blo_out', 'blo_sent', 'blo_push', 'blo_alseen'].forEach(LS.del); kvClear(); location.reload(); };
  sheet('sh-set', true);
}
$('b-set').onclick = setSheet;
$('b-al').onclick = function(){ go('alerts'); };
$('b-ref').onclick = function(){ refresh(true); };
function theme(){ var t = LS.get('blo_theme') || 'auto'; if(t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); var m = document.querySelector('meta[name=theme-color]'); if(m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#0b0f1a'; }

/* ── 9 · phone notifications ───────────────────────────────────────── */
function swReg(){ return 'serviceWorker' in navigator && window.isSecureContext ? navigator.serviceWorker.register('bl-owner-sw.js').then(function(){ return navigator.serviceWorker.ready; }) : Promise.reject(new Error('no sw')); }
function pushOn(){
  if(!SNAP || !SNAP.vapid) { toast('Open BuildLedger on the computer once so it can set up alerts.'); return Promise.resolve(); }
  return Notification.requestPermission().then(function(p){
    if(p !== 'granted') throw new Error(LANG === 'ta' ? 'அனுமதி மறுக்கப்பட்டது' : 'Notifications were not allowed');
    return swReg();
  }).then(function(reg){ return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:unb64u(SNAP.vapid)}); })
    .then(function(sub){ LS.set('blo_push', sub.endpoint); var dev = /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android phone' : 'Phone'; return send({type:'sub', sub:sub.toJSON(), dev:dev}); })
    .then(function(){ toast('🔔 ' + (LANG === 'ta' ? 'அறிவிப்புகள் இயக்கப்பட்டன' : 'Alerts are on for this phone')); })
    .catch(function(e){ toast(e && e.message ? e.message : 'Could not switch alerts on'); });
}
function pushOff(){
  var ep = LS.get('blo_push'); LS.del('blo_push');
  if(ep) send({type:'unsub', endpoint:ep});
  return swReg().then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(s){ return s && s.unsubscribe(); }).catch(function(){});
}

/* ── 12 · staying fresh, and offline ───────────────────────────────── */
function refresh(manual){
  if(!KEY || !CFG) return;
  if(manual) $('b-ref').innerHTML = '<span class="spin"></span>';
  fetchBlob().then(function(r){ return openBlob(r.b, KEY).then(function(s){ var first = !SNAP || s.at !== SNAP.at; if(first) show(s, r.live); else $('offline').classList.toggle('hide', r.live); }); })
    .catch(function(){}).then(function(){ $('b-ref').textContent = '⟳'; if(manual) toast('⟳ ' + L('upd') + ' ' + (SNAP ? ago(SNAP.at) : '')); });
}
var hiddenAt = 0;
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(KEY && LS.get('blo_lock') !== false && hiddenAt && Date.now() - hiddenAt > 5 * 60000){ lock(); return; }
  refresh(false);
});
window.addEventListener('online', function(){ refresh(false); flushOut(); });
setInterval(function(){ if(!document.hidden) refresh(false); }, 60000);

/* ── start ─────────────────────────────────────────────────────────── */
theme(); readLink(); padBuild();
LANG = LS.get('blo_lang') || 'en';
$('lk-bio').onclick = bioUnlock;
if(!CFG){
  $('lk-t').textContent = L('nolink'); $('lk-p').textContent = L('nolinkp'); $('pad').hidden = true; $('dots').hidden = true;
} else {
  $('lk-p').textContent = L('pin'); bioButton();
  if('serviceWorker' in navigator && window.isSecureContext) swReg().catch(function(){});
  if(LS.get('blo_lock') === false) kvGet('key').then(function(k){ if(!k) return; KEY = k; fetchBlob().then(function(r){ return openBlob(r.b, k).then(function(s){ show(s, r.live); }); }).catch(function(){ KEY = null; }); });
  else if(LS.get('blo_bio') && bioOk()) setTimeout(bioUnlock, 400);
}
window.BLO = {go:go, refresh:refresh, send:send, flushOut:flushOut, state:function(){ return {snap:SNAP, sent:SENT, out:outbox(), view:VIEW, lang:LANG}; }, lock:lock};
</script>
