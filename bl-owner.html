<style>
:root{--bg:#0b0f1a;--bg2:#121828;--bg3:#182035;--bg4:#202a44;--b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.14);--text:#f4f7ff;--text2:#c9d2e8;--text3:#9aa6c4;--text4:#7d89a8;
  --cyan:#22d3ee;--lime:#c6f432;--mint:#34d399;--amber:#fbbf24;--coral:#fb6f84;--violet:#a78bfa;--ease:cubic-bezier(.2,.8,.2,1);--safe-b:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f3f5fb;--bg2:#ffffff;--bg3:#ffffff;--bg4:#eef1f8;--b1:rgba(15,23,42,.09);--b2:rgba(15,23,42,.16);--text:#0f172a;--text2:#24324d;--text3:#4b5876;--text4:#5d6a86;
  --cyan:#0891b2;--lime:#4d7c0f;--mint:#047857;--amber:#b45309;--coral:#be123c;--violet:#6d28d9}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f5fb;--bg2:#ffffff;--bg3:#ffffff;--bg4:#eef1f8;--b1:rgba(15,23,42,.09);--b2:rgba(15,23,42,.16);--text:#0f172a;--text2:#24324d;--text3:#4b5876;--text4:#5d6a86;--cyan:#0891b2;--lime:#4d7c0f;--mint:#047857;--amber:#b45309;--coral:#be123c;--violet:#6d28d9}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil","Latha",sans-serif;min-height:100%}
body{padding-bottom:calc(76px + var(--safe-b))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg4);border:1px solid var(--b2);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 25%,transparent)}
.hide{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--b1)}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,var(--lime),var(--cyan));color:#06131a;font-weight:900}
.tt{flex:1;min-width:0}.tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{color:var(--text3);font-size:12px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg3);border:1px solid var(--b1);font-size:17px;position:relative}
.ib em{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font:800 11px/18px system-ui;font-style:normal;text-align:center;padding:0 4px}
.offline{margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber);font-size:12.5px;font-weight:700}
main{padding:14px 16px 96px;max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block;animation:in .35s var(--ease) both}
h2{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{color:var(--cyan);text-transform:none;letter-spacing:0;font-size:13px;text-decoration:none}
.card{background:var(--bg3);border:1px solid var(--b1);border-radius:18px;padding:16px;margin-bottom:12px;animation:pop .45s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{--c:var(--cyan);position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--c) 14%,transparent),transparent 60%),var(--bg3);border:1px solid var(--b1);border-radius:18px;padding:14px 14px 13px;animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.tile::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c)}
.tile small{display:block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text3)}
.tile b{display:block;font-size:22px;font-weight:900;margin-top:4px;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;font-size:12px;color:var(--text3);margin-top:2px}
.tile.wide{grid-column:1/-1}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--b1)}
.row:first-child{border-top:0;padding-top:2px}
.row .ic{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;background:var(--bg4);font-size:17px}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .m small{display:block;color:var(--text3);font-size:12.5px}
.row .a{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .a small{display:block;font-weight:600;color:var(--text3);font-size:11.5px}
.bad{color:var(--coral)!important}.good{color:var(--mint)!important}.warn{color:var(--amber)!important}
.bar{height:7px;border-radius:9px;background:var(--bg4);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--cyan));transform-origin:left;animation:grow .9s var(--ease) both .2s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;background:var(--bg4);border:1px solid var(--b2);font-weight:800;font-size:14px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--lime),#a3e635);color:#13200a;border:0}
.btn.wa{background:#25d366;color:#04210f;border:0}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-block;white-space:normal;line-height:1.35;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:800;background:var(--bg4);color:var(--text3)}
.empty{text-align:center;color:var(--text3);padding:26px 10px}.empty .e{font-size:38px;display:block;margin-bottom:6px;animation:float 3.4s ease-in-out infinite}
.stg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--b1);font-size:13.5px}
.stg:first-of-type{border-top:0}.stg small{grid-column:1/-1;color:var(--text3);font-size:12px}
.done-note{font-size:12.5px;color:var(--mint);font-weight:700;margin-top:8px}
/* bottom navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--bg2) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--b1)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--text3);position:relative;transition:color .2s}
nav button i{font-style:normal;font-size:20px;transition:transform .25s var(--ease)}
nav button.on{color:var(--cyan)}nav button.on i{transform:translateY(-2px) scale(1.12)}
nav button em{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font:800 10.5px/17px system-ui;font-style:normal;padding:0 4px}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));z-index:31;width:58px;height:58px;border-radius:19px;background:linear-gradient(135deg,var(--lime),var(--cyan));color:#06131a;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 14px 32px rgba(0,0,0,.4);transition:transform .2s var(--ease)}
.fab:active{transform:scale(.92)}
/* sheets */
.veil{position:fixed;inset:0;z-index:40;background:rgba(3,6,14,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--safe-b));transform:translateY(105%);transition:transform .35s var(--ease);max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--b2);margin:4px auto 12px}
.sheet h3{font-size:18px;margin-bottom:12px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.seg{display:flex;background:var(--bg4);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:800;font-size:14px;color:var(--text3)}
.seg button.on{background:var(--bg2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--b1)}
.opt span small{display:block;color:var(--text3);font-size:12.5px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--bg4);border:1px solid var(--b2);position:relative;flex:0 0 50px;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text3);transition:transform .25s var(--ease),background .2s}
.sw.on{background:color-mix(in srgb,var(--mint) 40%,var(--bg4))}.sw.on::after{transform:translateX(20px);background:var(--mint)}
/* lock screen */
#lock{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(80% 60% at 50% 0%,color-mix(in srgb,var(--cyan) 18%,transparent),transparent 70%),var(--bg)}
#lock .logo{width:64px;height:64px;font-size:32px;border-radius:20px;animation:pop .6s var(--ease) both}
#lock h1{font-size:20px;text-align:center}#lock p{color:var(--text3);text-align:center;max-width:320px;font-size:14px}
.dots{display:flex;gap:12px;margin:6px 0 4px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--b2);transition:background .15s,transform .15s}.dots i.f{background:var(--cyan);border-color:var(--cyan);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:64px;border-radius:20px;background:var(--bg3);border:1px solid var(--b1);font-size:24px;font-weight:700;transition:transform .1s,background .15s}
.pad button:active{transform:scale(.93);background:var(--bg4)}
.pad button.k{font-size:14px;font-weight:800;color:var(--text3)}
.msg{min-height:20px;font-size:13.5px;font-weight:700;color:var(--coral);text-align:center}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:70;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;transition:all .3s var(--ease);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--b2);border-top-color:var(--cyan);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px}

[hidden]{display:none!important}
.target{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:14px;position:relative;margin-top:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--lime) 14%,var(--bg3)),var(--bg3) 60%)}
.target .ring{width:96px;height:96px;transform:rotate(-90deg)}.target .rt{fill:none;stroke:color-mix(in srgb,var(--lime) 18%,var(--bg4));stroke-width:12}
.target .rv{fill:none;stroke:url(#none);stroke:var(--lime);stroke-width:12;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:ringIn 1.4s var(--ease) .2s forwards;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--lime) 60%,transparent))}
@keyframes ringIn{to{stroke-dashoffset:var(--off)}}
.target .rp{position:absolute;left:16px;top:50%;width:96px;transform:translateY(-50%);text-align:center;font-weight:900;font-size:20px;color:var(--lime)}
.target .m small{display:block;font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--text3)}.target .m b{display:block;font-size:22px;font-weight:900;color:var(--text)}.target .m span{display:block;color:var(--text3);font-size:13px}.target .m em{display:block;font-style:normal;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--amber)}
.donut{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}.dn{width:132px;height:132px}.dn .arc{opacity:0;animation:fadeArc .5s var(--ease) forwards;animation-delay:calc(.15s + var(--i)*90ms)}
@keyframes fadeArc{to{opacity:1}}.dn .dt{font:700 10px system-ui;fill:var(--text3);letter-spacing:1px;text-transform:uppercase}.dn .dv{font:900 15px system-ui;fill:var(--text)}
.dl div{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:center;padding:5px 0;border-top:1px solid var(--b1);font-size:13px}.dl div:first-child{border-top:0}.dl i{width:10px;height:10px;border-radius:3px}
.dl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl b{font-variant-numeric:tabular-nums}.dl small{grid-column:2/4;color:var(--text3);font-size:11.5px;margin-top:-3px}
@media (max-width:360px){.donut{grid-template-columns:1fr;justify-items:center}}
.upi-qr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 14px}.upi-qr canvas{width:220px;height:220px;border-radius:16px;background:#fff;padding:8px;box-shadow:0 14px 30px -16px rgba(0,0,0,.6)}.upi-qr small{color:var(--text2);font-weight:700}
.btn.upi{background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff;border:0}
.hero .hero-img{position:absolute;right:14px;bottom:44px;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);color:#fff;font-size:16px;z-index:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .chip{z-index:1}
.ib.on{background:color-mix(in srgb,var(--amber) 22%,var(--bg3));border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
#speak-day.rec{background:color-mix(in srgb,var(--coral) 20%,var(--bg4));animation:pulse 1s ease-in-out infinite}
.den{display:grid;grid-template-columns:1fr 1fr;gap:8px}.den label{display:flex!important;align-items:center;gap:8px;margin:0!important;font-size:13px!important;letter-spacing:0!important;text-transform:none!important;color:var(--text2)!important}.den label span{flex:0 0 74px}.den input{padding:9px 10px}
.cdiff{margin-top:-2px}.cdiff b{display:block;font-size:16px}.cdiff small{display:block;color:var(--text3);margin-top:2px}
small.act{display:block;color:var(--text3);font-size:12px;white-space:normal;margin-top:2px}
.top .ib{width:34px;height:34px;font-size:15px}.top{gap:5px}
@media (max-width:420px){.tt b{font-size:14.5px}.tt small{font-size:11px}.logo{width:32px;height:32px;font-size:16px}}
.card.limit{border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 12%,var(--bg3))}.card.limit b{display:block;color:var(--amber)}.card.limit small{color:var(--text2)}
.plr{padding:9px 0;border-top:1px solid var(--b1)}.plr:first-child{border-top:0}.pln{display:flex;justify-content:space-between;gap:10px;font-size:14px}.pln b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pln span{font-weight:800;white-space:nowrap}
.plb{height:8px;border-radius:8px;background:var(--bg4);margin:6px 0 3px;overflow:hidden}.plb i{display:block;height:100%;border-radius:8px;transform-origin:left;animation:grow .8s var(--ease) both}.plr small{color:var(--text3);font-size:12px}
.note2{color:var(--text3);font-size:12.5px;line-height:1.5;margin-top:12px}
.star{flex:0 0 auto;width:34px;height:34px;border-radius:10px;font-size:19px;line-height:1;color:var(--text3)}.star.on{color:var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.res{margin:6px 0 12px}.res .note{display:block;color:var(--text3);font-size:12px;margin-top:8px}
svg.flow{width:100%;height:auto;display:block}svg.flow text{font:600 10px system-ui;fill:var(--text3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text3);margin:6px 0 4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.att{display:flex;flex-direction:column;max-height:44vh;overflow:auto;border:1px solid var(--b1);border-radius:12px;margin-bottom:8px}
.chk{display:flex!important;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--b1);margin:0!important;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--text)!important}

.field label.btn{display:flex;margin:0;font-size:14px;letter-spacing:0;text-transform:none;color:var(--text)}
.top{gap:6px}.tt b{font-size:15.5px}
.tap{cursor:pointer}.card.tap:active,.row.tap:active{opacity:.75}
.seg4{flex-wrap:wrap}.seg4 button{flex:1 1 30%;font-size:12.5px;height:36px;padding:0 4px}
.heard{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--bg4);color:var(--text2);font-size:13.5px}

#ptr.go{opacity:1!important;animation:rot .8s linear infinite}

.ro #fab{display:none!important}.ro-pill{vertical-align:1px;font-size:10.5px;padding:1px 7px}
.row .btn.sm{flex:0 0 auto}

/* ══ Owner phone · design layer (colour, depth, motion) ══════════════════ */
:root{--r-card:20px;--r-tile:20px;--glass:color-mix(in srgb,var(--bg2) 72%,transparent);--violet2:#7c5cff;--pink:#ff5fa2;

  filter:blur(10px);animation:aurora 26s ease-in-out infinite alternate}

/* header */

/* section heads */
h2{margin:26px 2px 12px;font-size:12px;letter-spacing:1.6px;color:var(--text3)}
h2::before{content:'';display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:9px;vertical-align:1px;background:var(--g-pri);box-shadow:0 0 10px color-mix(in srgb,var(--cyan) 70%,transparent)}
h2{display:flex;align-items:center;justify-content:flex-start;gap:0}h2 a{margin-left:auto;padding-left:10px}
/* cards */
.card{border-radius:var(--r-card);background:linear-gradient(180deg,color-mix(in srgb,var(--bg3) 92%,var(--cyan) 8%),var(--bg3));border:1px solid color-mix(in srgb,var(--b2) 70%,transparent);box-shadow:var(--shadow);padding:14px 16px}
.row{gap:12px;padding:12px 0}.row .ic{border-radius:13px;background:linear-gradient(145deg,color-mix(in srgb,var(--cyan) 16%,var(--bg4)),var(--bg4));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--b2) 60%,transparent)}
.row.tap,.card.tap{transition:transform .15s var(--ease)}.row.tap:active,.card.tap:active{transform:scale(.985);opacity:1}
/* ── hero ─────────────────────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;margin-bottom:12px;color:#fff;background:var(--g-hero);
  box-shadow:0 22px 44px -22px rgba(91,43,214,.75);animation:pop .6s var(--ease) both}

  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 24%,var(--bg3)) 0%,color-mix(in srgb,var(--c) 6%,var(--bg3)) 55%,var(--bg3) 100%);
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);box-shadow:0 14px 28px -18px color-mix(in srgb,var(--c) 75%,transparent);
  transition:transform .18s var(--ease),box-shadow .25s;animation:tileIn .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.tile:active{transform:scale(.97)}

  background:radial-gradient(circle,color-mix(in srgb,var(--c) 38%,transparent),transparent 68%);animation:orb 7s ease-in-out infinite alternate}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;background:linear-gradient(115deg,transparent 35%,color-mix(in srgb,#fff 16%,transparent) 48%,transparent 60%);transform:translateX(-130%);animation:sheen 1.6s var(--ease) both;animation-delay:calc(.35s + var(--i,0)*70ms)}

  background:color-mix(in srgb,var(--c) 22%,var(--bg4));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 6px 14px -8px var(--c)}

@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* make a photo small enough to travel: longest side 1280px, about 250 KB */
function shrink(file){
  return new Promise(function(ok, no){
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ URL.revokeObjectURL(u); var max = 1280, w = im.naturalWidth, h = im.naturalHeight, r = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
      c.width = Math.round(w * r); c.height = Math.round(h * r); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      var q = 0.72, d = c.toDataURL('image/jpeg', q); while(d.length > 340000 && q > 0.3){ q -= 0.1; d = c.toDataURL('image/jpeg', q); } ok(d); };
    im.onerror = function(){ URL.revokeObjectURL(u); no(new Error('bad image')); }; im.src = u;
  });
}

function hit(hay, q){ hay = String(hay || '').toLowerCase(); if(hay.indexOf(q) >= 0) return true; var b = bones(q); return b.length >= 3 && hay.split(/\s+/).some(function(w){ return bones(w).indexOf(b) === 0; }); }
function findRows(raw){
  var q = String(raw || '').trim().toLowerCase(); if(q.length < 2) return '';

  (SNAP.quotes || []).forEach(function(x){ if(hit(x.n, q) || hit(x.t, q)) r.push('<div class="row tap" data-go="money"><div class="ic">📝</div><div class="m"><b>' + esc(x.n) + '</b><small>' + esc(x.t || '') + '</small></div><div class="a">' + short(x.a) + '</div></div>'); });

/* 6 · cash over the next 30 days */
function flowChart(s){

  var start = ((s.cash || {}).accs || []).reduce(function(a, x){ return a + x.b; }, 0), wk = [], bal = start, low = {v:start, d:''};
  f.forEach(function(x, i){ var w = Math.floor(i / 7); if(!wk[w]) wk[w] = {i:0, o:0, d:x.d}; wk[w].i += x.in || 0; wk[w].o += x.out || 0; bal += (x.in || 0) - (x.out || 0); if(bal < low.v) low = {v:bal, d:x.d}; });
  var mx = Math.max.apply(null, [1].concat(wk.map(function(w){ return Math.max(w.i, w.o); }))), W = 300, H = 120, bw = W / wk.length;
  var svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 18) + '" class="flow" role="img" aria-label="Cash in and out by week">' + wk.map(function(w, i){
    var x = i * bw + bw * 0.18, b = bw * 0.3, hi = w.i / mx * H, ho = w.o / mx * H;
    return '<rect x="' + x.toFixed(1) + '" y="' + (H - hi).toFixed(1) + '" width="' + b.toFixed(1) + '" height="' + hi.toFixed(1) + '" rx="3" fill="var(--mint)"/>'
      + '<rect x="' + (x + b + 2).toFixed(1) + '" y="' + (H - ho).toFixed(1) + '" width="' + b.toFixed(1) + '" height="' + ho.toFixed(1) + '" rx="3" fill="var(--coral)"/>'
      + '<text x="' + (i * bw + bw / 2).toFixed(1) + '" y="' + (H + 14) + '" text-anchor="middle">' + esc(fd(w.d)) + '</text>'; }).join('') + '</svg>';

    + '<div class="row"><div class="ic">' + (low.v < 0 ? '⚠️' : '✅') + '</div><div class="m"><b style="white-space:normal" class="' + (low.v < 0 ? 'bad' : '') + '">' + esc(L('lowest')) + ' ' + rs(low.v) + '</b><small>' + (low.d ? fd(low.d) : '') + (low.v < 0 ? ' · ' + esc(L('short')) : '') + '</small></div><div class="a">' + rs(bal) + '<small>' + esc(L('in30')) + '</small></div></div></div>';

/* ── 9 · phone notifications ───────────────────────────────────────── */
function swReg(){
  if(!('serviceWorker' in navigator) || !window.isSecureContext) return Promise.reject(new Error(L('nosw')));
  return Promise.race([navigator.serviceWorker.register('bl-owner-sw.js').then(function(){ return navigator.serviceWorker.ready; }),
    new Promise(function(_, no){ setTimeout(function(){ no(new Error(L('swslow'))); }, 15000); })]);
}
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
/* why this phone cannot get alerts, in plain words — '' when it can */
function pushBlock(){
  var ua = navigator.userAgent;
  if(/FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)/.test(ua)) return L('inapp');
  if(isIOS() && !standalone()) return L('iosicon');
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return isIOS() ? L('iosold') : L('nopush');
  if(Notification.permission === 'denied') return L('blocked');

}
function sameKey(sub){ try{ var k = sub.options && sub.options.applicationServerKey; return !k || b64u(k) === SNAP.vapid; }catch(e){ return true; } }
function subscribe(reg){
  var opt = {userVisibleOnly:true, applicationServerKey:unb64u(SNAP.vapid)};
  return reg.pushManager.getSubscription().then(function(old){
    if(old && sameKey(old)) return old;
    return (old ? old.unsubscribe() : Promise.resolve()).then(function(){ return reg.pushManager.subscribe(opt); });
  }).catch(function(e){
    if(e && /InvalidState|already/i.test(e.name + e.message)) return reg.pushManager.getSubscription().then(function(o){ return o && o.unsubscribe(); }).then(function(){ return reg.pushManager.subscribe(opt); });
    throw e;
  });
}
function devName(){ return isIOS() ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android phone' : 'Phone'; }
function signUp(sub){
  var id = b64u(rand(9)); LS.set('blo_push', sub.endpoint); LS.set('blo_subid', {id:id, at:Date.now(), ep:sub.endpoint});

function pushOn(){

    if(p !== 'granted') throw new Error(L('blocked'));

  }).then(subscribe).then(signUp).then(function(sent){

  }).catch(function(e){ toast('⚠ ' + (e && e.message ? e.message : L('pushfail'))); });
}
function pushOff(){

function pushHeal(){

  swReg().then(function(reg){ return reg.pushManager.getSubscription().then(function(s){ return s && sameKey(s) ? s : subscribe(reg); }); })
    .then(function(s){ var mine = LS.get('blo_subid'); if(!mine || mine.ep !== s.endpoint) signUp(s); }).catch(function(){});
}

function diagSheet(){
  $('sh-diag').innerHTML = '<div class="grab"></div><h3>🩺 ' + esc(L('diag')) + '</h3><div class="card" id="dg-l"><div class="empty"><span class="spin"></span></div></div>'
    + '<div class="btns"><button class="btn pri" id="dg-test" style="flex:1">🔔 ' + esc(L('testal')) + '</button><button class="btn" id="dg-fix">🔄 ' + esc(L('repair')) + '</button></div>'

function diagRun(){
  var rows = [], add = function(ok, t, s){ rows.push('<div class="row"><div class="ic">' + (ok === true ? '✅' : ok === false ? '❌' : '⏳') + '</div><div class="m"><b style="white-space:normal">' + esc(t) + '</b>' + (s ? '<small style="white-space:normal">' + esc(s) + '</small>' : '') + '</div></div>'); };
  var why = pushBlock(), mine = LS.get('blo_subid'), acked = mine && (SNAP.acks || []).indexOf(mine.id) >= 0, queued = mine && outbox().some(function(m){ return m.id === mine.id; });
  add(!!SNAP.vapid, L('d_pc'), SNAP.vapid ? '' : L('novapid'));
  add(!why, L('d_browser'), why);
  var perm = 'Notification' in window ? Notification.permission : 'default';
  if(!why) add(perm === 'granted' ? true : perm === 'denied' ? false : null, L('d_perm'), perm === 'granted' ? '' : perm === 'denied' ? L('blocked') : L('d_permask'));
  var done = function(reg, sub){
    if(!why){
      add(!!(reg && reg.active), L('d_sw'), reg && reg.active ? '' : L('swslow'));
      add(!!sub && sameKey(sub), L('d_sub'), !sub ? L('d_subno') : sameKey(sub) ? '' : L('d_subold'));
      add(acked ? true : mine ? null : false, L('d_got'), acked ? '' : queued ? L('d_queued') : mine ? L('d_wait') + ' ' + ago(mine.at) : L('d_subno'));
    }
    var last = (SNAP.alerts || []).slice(-1)[0];
    add(last ? true : null, L('d_last'), last ? last.t + ' · ' + ago(last.at) : L('d_none'));
    $('dg-l').innerHTML = rows.join('');
  };
  if(why || !('serviceWorker' in navigator)) return done(null, null);
  navigator.serviceWorker.getRegistration().then(function(reg){ return reg ? reg.pushManager.getSubscription().then(function(s){ done(reg, s); }) : done(null, null); }).catch(function(){ done(null, null); });
}

function refresh(manual){

  if(manual) $('b-ref').innerHTML = '<span class="spin"></span>';
  fetchBlob().then(function(r){ return openBlob(r.b, KEY).then(function(s){ var first = !SNAP || s.at !== SNAP.at; if(first) show(s, r.live); else $('offline').classList.toggle('hide', r.live); }); })

  else if(LS.get('blo_bio') && bioOk()) setTimeout(bioUnlock, 400);
}
window.BLO = {go:go, refresh:refresh, send:send, flushOut:flushOut, state:function(){ return {snap:SNAP, sent:SENT, out:outbox(), view:VIEW, lang:LANG}; }, lock:lock};

<script>
/* ══ Owner phone · design layer: hero, tile icons, count-up, sliding nav ══ */
(function(){
'use strict';
var ICON = {'var(--mint)':'↘', 'var(--coral)':'↗', 'var(--cyan)':'👷', 'var(--amber)':'⏳', 'var(--lime)':'🏦', 'var(--violet)':'📊', 'var(--text3)':'🏦'};
var tile0 = tile;
tile = function(c, label, val, sub, i, wide){
  var h = tile0(c, label, val, sub, i, wide), ic = ICON[c] || '•';
  if(/received|வரவு|recv/i.test(label)) ic = '💰'; else if(/spent|செலவு/i.test(label)) ic = '💸'; else if(/profit|loss|லாபம்|நஷ்டம்/i.test(label)) ic = '📈';
  else if(/overdue|தாமதம்/i.test(label)) ic = '⏰'; else if(/contract|ஒப்பந்த/i.test(label)) ic = '📑'; else if(/going out|செலவு/i.test(label)) ic = '↗'; else if(/coming in|வரவு/i.test(label)) ic = '↘';
  return h.replace('<small>', '<i class="ti" aria-hidden="true">' + ic + '</i><small>');
};
/* the hero: net for the day, and how received and spent compare */
var home0 = home;
home = function(){
  home0();
  if(!SNAP || PERX !== 'd') return;
  var d = SNAP.today || {}, rev = Number(d.rev) || 0, cost = Number(d.cost) || 0, net = rev - cost, tot = rev + cost, pin = tot ? rev / tot * 100 : 50;
  var ta = LANG === 'ta', h = '<div class="hero"><span class="chip">' + esc(fd(d.date || todayIso())) + '</span><button class="hero-img" id="hero-img" aria-label="Share as picture">🖼</button><small>' + (ta ? 'இன்றைய நிகரம்' : 'Net today') + '</small>'
    + '<b class="hero-v">' + rs(net) + '</b><div class="split"><i class="in" style="width:' + pin.toFixed(1) + '%"></i><i class="out" style="width:' + (100 - pin).toFixed(1) + '%"></i></div>'
    + '<div class="legend2"><span><i style="background:#34d399"></i>' + (ta ? 'வரவு ' : 'In ') + rs(rev) + '</span><span><i style="background:#fb7185"></i>' + (ta ? 'செலவு ' : 'Out ') + rs(cost) + '</span></div></div>';
  var host = $('v-home'), seg = $('per');
  if(seg) seg.insertAdjacentHTML('afterend', h); else host.insertAdjacentHTML('afterbegin', h);
  if($('hero-img')) $('hero-img').onclick = function(){ netImage(); };
  if(VIEW === 'home') setTimeout(function(){ strips(); countUp($('v-home'), 'home'); }, 0);
};
/* ── numbers count up: the page keeps the true figure, the screen animates ── */
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, seen = {};
function parse(t){
  var m = /^([−-]?)(₹?)([\d,]+(?:\.\d+)?)(\s*(?:L|Cr|%))?$/.exec(String(t).trim()); if(!m) return null;
  var raw = m[3].replace(/,/g, ''), dec = (raw.split('.')[1] || '').length;
  return {neg:m[1], cur:m[2], v:Number(raw), dec:dec, suf:m[4] || '', grp:m[3].indexOf(',') >= 0 || (m[2] && Number(raw) >= 1000)};
}
function fmt(p, v){ var s = p.dec ? v.toFixed(p.dec) : String(Math.round(v)); if(p.grp && !p.dec) s = Math.round(v).toLocaleString('en-IN'); return p.neg + p.cur + s + p.suf; }
function countUp(root, key){

<script>
/* ══ 1.37.3 · getting back: ‹ Back and ✕ on every panel, the phone's Back button, photo viewer ══
   Panels (customer page, photo, entry, settings …) open on top of each other; Back closes only the
   top one. The phone's own Back button / swipe does the same, then returns to Today. */
(function(){
var SEQ = 0, N = 0, HOMEJUMP = false, POP = false;
function tx(en, ta){ return LANG === 'ta' ? ta : en; }
function open(){ return [].slice.call(document.querySelectorAll('.sheet.on')).sort(function(a, b){ return (a._seq || 0) - (b._seq || 0); }); }
function top(){ var o = open(); return o[o.length - 1] || null; }
function restack(){ open().forEach(function(s, i){ s.style.zIndex = 41 + Math.min(i, 15); }); }   /* below the toast (60) and lock (70) */
function veil(){ $('veil').classList.toggle('on', !!document.querySelector('.sheet.on')); }
function push(){ if(POP) return; try{ N++; history.pushState({blo:N}, ''); }catch(e){ N--; } }
function closeTop(){ var t = top(); if(t){ sheet0(t.id, false); veil(); return true; } return false; }
function closeAll(){ open().forEach(function(s){ sheet0(s.id, false); }); veil(); }
/* the bar on top of every panel */
function bar(sh){
  if(!sh.classList.contains('on') || sh.querySelector(':scope > .shbar')) return;
  var g = sh.querySelector(':scope > .grab'), b = document.createElement('div'); b.className = 'shbar';
  b.innerHTML = '<button class="sh-back" type="button">‹ ' + tx('Back', 'பின்') + '</button>'
    + (open().length > 1 ? '<button class="sh-home" type="button">🏠 ' + esc(L('home')) + '</button>' : '')
    + '<button class="sh-x" type="button" aria-label="' + tx('Close', 'மூடு') + '">✕</button>';
  if(g) b.appendChild(g);
  sh.insertBefore(b, sh.firstChild);
}
var sheet0 = sheet;
sheet = function(id, on){
  var el = $(id), was = el.classList.contains('on');
  sheet0(id, on);
  if(on){ el._seq = ++SEQ; restack(); var old = el.querySelector(':scope > .shbar'); if(old) old.remove(); bar(el); if(!was) push(); }
};
[].forEach.call(document.querySelectorAll('.sheet'), function(sh){
  new MutationObserver(function(){ bar(sh); }).observe(sh, {childList:true});
  new MutationObserver(function(){ if(sh.classList.contains('on') && !sh._seq){ sh._seq = ++SEQ; bar(sh); } if(!sh.classList.contains('on')) sh._seq = 0; restack(); }).observe(sh, {attributes:true, attributeFilter:['class']});
});
/* Back: one step. Uses the phone's history when the step is ours, so both Backs stay in step. */
function back(){
  if(N > 0 && history.state && history.state.blo === N) history.back();
  else if(!closeTop() && VIEW !== 'home') go('home');
}
function home(){
  if(N > 0){ HOMEJUMP = true; history.go(-N); }
  else { closeAll(); if(VIEW !== 'home') go('home'); }
}
window.addEventListener('popstate', function(e){
  N = (e.state && e.state.blo) || 0; POP = true;
  try{
    if(HOMEJUMP){ HOMEJUMP = false; closeAll(); if(VIEW !== 'home') go('home'); }
    else if(!closeTop() && VIEW !== 'home') go('home');
  } finally { POP = false; }
});
$('veil').onclick = function(e){ e.stopPropagation(); back(); };
document.addEventListener('click', function(e){
  var b = e.target.closest('.shbar button, .vback'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  if(b.classList.contains('sh-home') || b.classList.contains('vback')) home(); else back();
}, true);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && (top() || VIEW !== 'home')) back(); });
/* sections (Money, Sites, Approve, Alerts): ‹ Today at the top, and the phone's Back returns to Today */
var go1 = go;
go = function(v){
  var from = VIEW; go1(v);
  if(v !== 'home' && from === 'home') push();
  else if(v === 'home' && from !== 'home' && N > 0 && !POP){ HOMEJUMP = true; history.go(-N); }
  chip();
};
function chip(){
  ['money', 'sites', 'ok', 'alerts'].forEach(function(v){ var el = $('v-' + v); if(el && !el.querySelector(':scope > .vback')) el.insertAdjacentHTML('afterbegin', '<button class="vback" type="button">‹ 🏠 ' + esc(L('home')) + '</button>'); });
}
['money', 'sites', 'ok', 'alerts'].forEach(function(v){ var el = $('v-' + v); if(el) new MutationObserver(chip).observe(el, {childList:true}); });
chip();
if(window.BLO) BLO.go = go;
/* photo viewer: ‹ › arrows, swipe, counter and a strip of the same set (one customer, or all) */
var SET = null, CUR = 0;
document.addEventListener('click', function(e){
  var p = e.target.closest('[data-ph]'); if(!p || e.target.closest('#sh-photo')) return;
  var grid = p.closest('.phg'); SET = grid ? [].map.call(grid.querySelectorAll('[data-ph]'), function(x){ return Number(x.getAttribute('data-ph')); }) : null;
}, true);
var pv0 = photoView;
photoView = function(i){
  if(!PHOTOS || !PHOTOS[i]) return;
  if(!SET || SET.indexOf(i) < 0) SET = PHOTOS.map(function(_, k){ return k; });
  CUR = SET.indexOf(i); var already = $('sh-photo').classList.contains('on');
  draw();
  if(!already) sheet('sh-photo', true);
};
function draw(){
  var i = SET[CUR], p = PHOTOS[i], n = SET.length;
  $('sh-photo').innerHTML = '<div class="grab"></div><div class="pv"><img class="big" src="' + esc(p.src) + '" alt="">'
    + (n > 1 ? '<button class="pva pvl" type="button" data-pv="-1"' + (CUR ? '' : ' disabled') + ' aria-label="' + tx('Previous', 'முந்தைய') + '">‹</button><button class="pva pvr" type="button" data-pv="1"' + (CUR < n - 1 ? '' : ' disabled') + ' aria-label="' + tx('Next', 'அடுத்து') + '">›</button><span class="pvn">' + (CUR + 1) + ' / ' + n + '</span>' : '')
    + '</div><div style="margin-top:10px"><b>' + esc(custOf(p.cid).n) + '</b> · ' + fd(p.d) + (p.cap ? '<div style="color:var(--text3)">' + esc(p.cap) + '</div>' : '') + '</div>'
    + (n > 1 ? '<div class="pvdots">' + SET.map(function(k, j){ var q = PHOTOS[k]; return '<button type="button" data-pvi="' + j + '" class="' + (j === CUR ? 'on' : '') + '"><img src="' + esc(q.src) + '" alt="" loading="lazy"></button>'; }).join('') + '</div>' : '');
  var d = $('sh-photo').querySelector('.pvdots button.on'); if(d) d.scrollIntoView({block:'nearest', inline:'center'});
}
function step(k){ if(!SET) return; var j = CUR + k; if(j < 0 || j >= SET.length) return; CUR = j; draw(); }
$('sh-photo').addEventListener('click', function(e){
  var a = e.target.closest('[data-pv]'); if(a){ e.stopPropagation(); step(Number(a.getAttribute('data-pv'))); return; }
  var t = e.target.closest('[data-pvi]'); if(t){ e.stopPropagation(); CUR = Number(t.getAttribute('data-pvi')); draw(); }
});
var x0 = null, y0 = null;
$('sh-photo').addEventListener('touchstart', function(e){ if(!e.target.closest('.pv')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
$('sh-photo').addEventListener('touchend', function(e){ if(x0 == null) return; var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) step(dx < 0 ? 1 : -1); }, {passive:true});
document.addEventListener('keydown', function(e){ if(!$('sh-photo').classList.contains('on')) return; if(e.key === 'ArrowRight') step(1); if(e.key === 'ArrowLeft') step(-1); });
window.BLONAV = {back:back, home:home, depth:function(){ return N; }, open:function(){ return open().map(function(s){ return s.id; }); }};
})();
</script>

}
function bars(root){ setTimeout(function(){ [].forEach.call(root.querySelectorAll('.kb i[data-w]'), function(i){ i.style.width = i.getAttribute('data-w') + '%'; }); }, 60); }
/* Today: the hero gets a ring (work done on all sites), the four day cards get small pictures */
function today(){
  var v = $('v-home'); if(!v || !SNAP) return;
  var hero = v.querySelector('.hero');
  if(hero && !hero.querySelector('.hgrid')){
    var pr = SNAP.projects || [], pct = pr.length ? Math.round(pr.reduce(function(a, p){ return a + (Number(p.pct) || 0); }, 0) / pr.length) : null;
    var lbl = hero.querySelector('small'), val = hero.querySelector('.hero-v'), img = hero.querySelector('.hero-img'), leg = hero.querySelector('.legend2'), chip = hero.querySelector('.chip');
    var grid = document.createElement('div'); grid.className = 'hgrid';
    var left = document.createElement('div'); left.style.minWidth = '0'; if(chip) left.appendChild(chip); left.appendChild(lbl); left.appendChild(val); grid.appendChild(left);
    if(pct != null){
      var C = 2 * Math.PI * 40, r = document.createElement('div'); r.className = 'hr';
      r.innerHTML = '<svg viewBox="0 0 96 96"><defs><linearGradient id="hrG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#A7F3D0"/></linearGradient></defs><circle class="t0" cx="48" cy="48" r="40"/><circle class="t1" cx="48" cy="48" r="40" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/></svg>'
        + '<div class="c"><b>' + pct + '%</b><em>' + (LANG === 'ta' ? 'வேலை' : 'work') + '</em></div>';
      grid.appendChild(r);
      setTimeout(function(){ var c = r.querySelector('.t1'); if(c) c.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(1); }, reduce ? 0 : 120);
    }
    hero.insertBefore(grid, hero.querySelector('.split'));
    var bot = document.createElement('div'); bot.className = 'hbot'; if(leg){ hero.appendChild(bot); bot.appendChild(leg); } if(img) bot.appendChild(img);
    hero.insertAdjacentHTML('beforeend', '<span class="rings" aria-hidden="true"></span>');
  }
  var g = v.querySelector('.tiles:not(#per)'); if(!g || PERX !== 'd' || g._viz) return; g._viz = 1;
  var t = g.querySelectorAll('.tile'), d = SNAP.today || {}, rev = Number(d.rev) || 0, cost = Number(d.cost) || 0, tot = rev + cost;
  var add = function(el, h){ if(el && !el.querySelector('.kv')) el.insertAdjacentHTML('beforeend', '<div class="kv">' + h + '</div>'); };
  add(t[0], '<div class="kb"><i data-w="' + (tot ? rev / tot * 100 : 0).toFixed(1) + '"></i></div>');
  if(t[1] && !t[1].querySelector('.tbar')) add(t[1], '<div class="kb"><i data-w="' + (tot ? cost / tot * 100 : 0).toFixed(1) + '"></i></div>');
  var w = Math.min(14, Number(d.workers) || 0), cap = Math.max(w, 8);
  add(t[2], '<div class="kd">' + Array.apply(null, Array(cap)).map(function(_, i){ return '<i class="' + (i < w ? '' : 'o') + '" style="animation-delay:' + (500 + i * 60) + 'ms"></i>'; }).join('') + '</div>');
  var q = num(t[3] && t[3].querySelector('b').textContent);
  add(t[3], q ? '<div class="kp"><i></i>' + (LANG === 'ta' ? 'உங்கள் ஒப்புதலுக்கு' : 'needs you') + '</div>' : '<div class="kp" style="opacity:.7">✓ ' + (LANG === 'ta' ? 'எதுவும் இல்லை' : 'all clear') + '</div>');
}
function deco(v){ if(!v) return; heads(v); if(v.id === 'v-home') today(); glow(v); bars(v); }
['v-home', 'v-money', 'v-sites', 'v-ok', 'v-alerts'].forEach(function(id){
  var v = $(id); if(!v) return;
  new MutationObserver(function(){ deco(v); }).observe(v, {childList:true});
  deco(v);
});
[].forEach.call(document.querySelectorAll('.sheet'), function(sh){ new MutationObserver(function(){ heads(sh); }).observe(sh, {childList:true}); });
var go2 = go; go = function(v){ go2(v); var el = $('v-' + v); if(el){ [].forEach.call(el.querySelectorAll('.tile'), function(t){ t._g = 0; }); glow(el); } };
if(window.BLO) BLO.go = go;
var meta = document.querySelector('meta[name=theme-color]');
function tc(){ if(!meta) return; var th = document.documentElement.getAttribute('data-theme'); var dark = th === 'dark' || (!th || th === 'auto') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches; meta.setAttribute('content', dark ? '#080C1B' : '#F2F3FA'); }
new MutationObserver(tc).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']}); tc();
})();
