[hidden]{display:none!important}

.field label.btn{display:flex;margin:0;font-size:14px;letter-spacing:0;text-transform:none;color:var(--text)}
.top{gap:6px}.tt b{font-size:15.5px}

.seg4{flex-wrap:wrap}.seg4 button{flex:1 1 45%;font-size:13px;height:36px}

function b64u(bytes){ var s = '', a = new Uint8Array(bytes); for(var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

function deriveKey(pin){

    .then(function(k){ return crypto.subtle.deriveBits({name:'PBKDF2', salt:unb64u(CFG.salt), iterations:ITER, hash:'SHA-256'}, k, 256); })
    .then(function(bits){ return crypto.subtle.importKey('raw', bits, {name:'AES-GCM'}, false, ['encrypt', 'decrypt']); });
}

function sealObj(obj, key){ var iv = rand(12); return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(JSON.stringify(obj))).then(function(ct){ var c = new Uint8Array(ct), o = new Uint8Array(12 + c.length); o.set(iv, 0); o.set(c, 12); return b64u(o); }); }

/* ── a small key store the alerts helper can read too ─────────────── */
function idb(){ return new Promise(function(ok, no){ if(!window.indexedDB) return no(new Error('no idb')); var r = indexedDB.open('bl-owner', 1); r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); }; r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ no(r.error); }; }); }
function kvGet(k){ return idb().then(function(db){ return new Promise(function(ok){ var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function(){ ok(q.result); }; q.onerror = function(){ ok(null); }; }); }).catch(function(){ return null; }); }
function kvSet(k, v){ return idb().then(function(db){ return new Promise(function(ok){ var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = function(){ ok(true); }; tx.onerror = function(){ ok(false); }; }); }).catch(function(){ return false; }); }
function kvClear(){ return idb().then(function(db){ return new Promise(function(ok){ var tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = function(){ ok(true); }; }); }).catch(function(){}); }

/* ── where the summary lives ───────────────────────────────────────── */
function readLink(){
  var m = /[#&]o=([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)/.exec(location.hash || '');
  if(m){
    var url = ''; try{ url = new TextDecoder().decode(unb64u(m[4])); }catch(e){}
    if(/^https:\/\/[^\s/]+/.test(url) || /^http:\/\/(localhost|127\.)/.test(url)){
      var c = {id:m[1], inbox:m[2], salt:m[3], url:url.replace(/\/+$/, '')}, old = LS.get('blo_cfg');
      if(!old || old.id !== c.id || old.salt !== c.salt){ ['blo_blob', 'blo_bio', 'blo_out', 'blo_sent', 'blo_fails'].forEach(LS.del); fails = {n:0, until:0}; CLEARED = kvClear(); }
      LS.set('blo_cfg', c);
      try{ history.replaceState(null, '', location.pathname); }catch(e){}
    }
  }
  CFG = LS.get('blo_cfg');
  if(CFG) CLEARED.then(function(){ kvSet('cfg', CFG); });
}
function fetchBlob(){
  return fetch(CFG.url + '/p/' + CFG.id, {cache:'no-store'}).then(function(r){ if(r.status === 404) throw new Error('gone'); if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(t){ LS.set('blo_blob', {b:t, at:Date.now()}); return {b:t, live:true}; })
    .catch(function(e){ if(e && e.message === 'gone'){ LS.del('blo_blob'); throw e; } var c = LS.get('blo_blob'); if(c && c.b) return {b:c.b, live:false}; throw new Error('offline'); });
}

/* ── lock screen ───────────────────────────────────────────────────── */
var PIN = '', fails = LS.get('blo_fails') || {n:0, until:0};
function padBuild(){
  var keys = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
  $('pad').innerHTML = keys.map(function(k){ return '<button type="button" data-k="' + k + '"' + (k === '⌫' || k === 'OK' ? ' class="k"' : '') + '>' + k + '</button>'; }).join('');
  $('pad').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; press(b.getAttribute('data-k')); };
  document.addEventListener('keydown', function(e){ if($('lock').classList.contains('hide')) return; if(/^\d$/.test(e.key)) press(e.key); else if(e.key === 'Backspace') press('⌫'); else if(e.key === 'Enter') press('OK'); });
  dots();
}
function dots(){ var n = Math.max(6, PIN.length); $('dots').innerHTML = Array.from({length:n}, function(_, i){ return '<i class="' + (i < PIN.length ? 'f' : '') + '"></i>'; }).join(''); }
function press(k){
  if(Date.now() < fails.until){ $('lk-msg').textContent = L('wait') + ' ' + Math.ceil((fails.until - Date.now()) / 1000) + 's'; return; }
  if(k === '⌫'){ PIN = PIN.slice(0, -1); dots(); return; }
  if(k === 'OK'){ if(PIN.length >= 6) tryPin(); return; }
  if(PIN.length < 12){ PIN += k; dots(); $('lk-msg').textContent = ''; }
}
function tryPin(){
  var pin = PIN; $('lk-msg').innerHTML = '<span class="spin"></span>';
  var keyP = deriveKey(pin);
  Promise.all([keyP, fetchBlob()]).then(function(r){ return openBlob(r[1].b, r[0]).then(function(snap){ return {key:r[0], snap:snap, live:r[1].live}; }); })
    .then(function(x){
      fails = {n:0, until:0}; LS.set('blo_fails', fails); PIN = ''; dots();
      KEY = x.key; CLEARED.then(function(){ kvSet('key', KEY); });
      show(x.snap, x.live);
    }, function(e){
      PIN = ''; dots();
      if(e && e.message === 'offline'){ $('lk-msg').textContent = 'No connection and no saved copy yet.'; return; }
      if(e && e.message === 'gone'){ $('lk-msg').textContent = L('gone'); return; }
      fails.n++; if(fails.n >= 5){ fails.until = Date.now() + 30000 * Math.pow(2, Math.min(4, fails.n - 5)); }
      LS.set('blo_fails', fails);
      $('lk-msg').textContent = L('wrong'); $('dots').classList.remove('shake'); void $('dots').offsetWidth; $('dots').classList.add('shake');
    });
}
function lock(){ KEY = null; SNAP = null; ['top', 'nav', 'fab'].forEach(function(id){ $(id).classList.add('hide'); }); $('main').classList.add('hide'); $('lock').classList.remove('hide'); PIN = ''; dots(); bioButton(); }

/* ── 11 · fingerprint / face: the phone's own lock guards the saved key ─ */
function bioOk(){ return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext); }
function bioButton(){ var b = LS.get('blo_bio'); $('lk-bio').hidden = !(b && bioOk()); $('lk-bio-t').textContent = L('bio'); }
function bioRegister(){
  if(!bioOk()) return Promise.reject(new Error('This phone or browser cannot use fingerprint here.'));
  return navigator.credentials.create({publicKey:{challenge:rand(32), rp:{name:'BuildLedger Owner'}, user:{id:rand(16), name:'owner', displayName:'Owner'},
    pubKeyCredParams:[{type:'public-key', alg:-7}, {type:'public-key', alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'}, timeout:60000}})
    .then(function(c){ LS.set('blo_bio', {id:b64u(c.rawId)}); return true; });
}
function bioUnlock(){
  var b = LS.get('blo_bio'); if(!b) return;
  navigator.credentials.get({publicKey:{challenge:rand(32), allowCredentials:[{type:'public-key', id:unb64u(b.id)}], userVerification:'required', timeout:60000}})
    .then(function(){ return kvGet('key'); })
    .then(function(k){ if(!k) throw new Error('Enter your PIN once on this phone first.'); KEY = k; return fetchBlob().then(function(r){ return openBlob(r.b, k).then(function(s){ show(s, r.live); }); }); })
    .catch(function(e){ $('lk-msg').textContent = e && e.message && !/abort|NotAllowed/i.test(e.name + e.message) ? e.message : ''; });
}

/* ── showing it ────────────────────────────────────────────────────── */
function show(snap, live){
  SNAP = snap; LANG = LS.get('blo_lang') || (snap.ta ? 'ta' : 'en');
  $('lock').classList.add('hide'); ['top', 'nav', 'fab'].forEach(function(id){ $(id).classList.remove('hide'); }); $('main').classList.remove('hide');
  $('co').textContent = snap.co || 'BuildLedger'; document.body.classList.toggle('ro', snap.role === 'partner'); $('ro-pill').hidden = snap.role !== 'partner'; if(snap.phid !== (PHOTOS && PHOTOS._id)) PHOTOS = null;
  $('upd').textContent = L('upd') + ' ' + ago(snap.at);
  $('offline').classList.toggle('hide', !!live); $('offline').textContent = '📴 ' + L('off') + ' · ' + ago(snap.at);
  [].forEach.call(document.querySelectorAll('[data-l]'), function(e){ e.textContent = L(e.getAttribute('data-l')); });
  pruneSent(); render(); badges(); flushOut(); setTimeout(pushHeal, 1500);
  kvSet('seenAlert', Math.max.apply(null, [0].concat((snap.alerts || []).map(function(a){ return a.at; }))));
}
function badges(){
  var q = (SNAP.queue || []).filter(function(x){ return !SENT['q' + x.id]; }).length;
  $('q-n').hidden = !q; $('q-n').textContent = q;
  var seen = LS.get('blo_alseen') || 0, n = (SNAP.alerts || []).filter(function(a){ return a.at > seen; }).length;
  $('al-n').hidden = !n; $('al-n').textContent = n;
  try{ if(navigator.setAppBadge) (q + n ? navigator.setAppBadge(q + n) : navigator.clearAppBadge()); }catch(e){}
}
function render(){ home(); money(); sites(); approvals(); alerts(); }
function tile(c, label, val, sub, i, wide){ return '<div class="tile' + (wide ? ' wide' : '') + '" style="--c:' + c + ';--i:' + (i || 0) + '"><small>' + esc(label) + '</small><b>' + val + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + '</div>'; }
function empty(icon){ return '<div class="empty"><span class="e">' + icon + '</span>' + esc(L('none')) + '</div>'; }

/* ── what the computer can send (newer BuildLedger adds the optional parts) ──
   cust   [{id, n, p, ph}]                       pays  {cid:[{d, a, m, s}]}
   bills  [{id, cid, v, a, due, w, late, ph}]     leads {open, won, due:[{id, n, ph, w, st, next, val}]}
   labour {sites:[{cid, n, c, who:[]}], due:[{n, a}], dueTot}
   stock  {low:[{n, left, u, pct}], po:[{v, a, st, d}]}
   phid   id of the separate locked photo record {p:[{cid, d, cap, src}]}
   role   'owner' | 'partner' (partner: read only, no mailbox)                */
function todayIso(){ return new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function RO(){ return !!(SNAP && SNAP.role === 'partner'); }
function custOf(cid){ var c = (SNAP.cust || []).filter(function(x){ return String(x.id) === String(cid); })[0] || {id:cid, n:'—'}; if(!c.ph){ var o = (SNAP.owed || []).filter(function(x){ return String(x.cid) === String(cid); })[0]; if(o){ c.ph = o.ph; c.p = c.p || o.p; } } return c; }
function tel(ph){ var p = String(ph || '').replace(/[^\d+]/g, ''); return p ? '<a class="btn sm" href="tel:' + esc(p) + '" aria-label="Call">📞</a>' : ''; }
function sec(t, link){ return '<h2>' + esc(t) + (link || '') + '</h2>'; }

/* 1 + 2 · Today */
function dueToday(){
  var t = todayIso(), out = [];
  (SNAP.stages || []).forEach(function(c){ c.s.forEach(function(st){ var bal = st.a - st.got; if(bal > 0.5 && st.due && st.due <= t) out.push({ic:'🧱', t:c.n + ' — ' + st.n, s:(st.due < t ? L('late') + ' ' : L('due') + ' ') + fd(st.due), a:bal, late:st.due < t, cid:c.cid, dir:'in'}); }); });
  (SNAP.bills || []).forEach(function(b){ if(b.due && b.due <= t) out.push({ic:'🧾', t:b.v, s:esc(b.w) + ' · ' + (b.due < t ? L('late') + ' ' : L('due') + ' ') + fd(b.due), a:b.a, late:b.due < t, ph:b.ph, dir:'out'}); });
  ((SNAP.today || {}).appts || []).forEach(function(a){ out.push({ic:'🤝', t:a.who, s:(a.tm ? a.tm + ' · ' : '') + a.what}); });
  ((SNAP.leads || {}).due || []).forEach(function(l){ if(l.next && l.next <= t) out.push({ic:'📞', t:l.n, s:(LANG === 'ta' ? 'விசாரணை' : 'Enquiry') + ' · ' + (l.w || ''), ph:l.ph}); });
  return out;
}
function home(){
  var s = SNAP, d = s.today || {}, c = s.cash || {}, h = '';

  h += periodTiles(s);

    + tile('var(--cyan)', L('wk'), String(d.workers || 0), (d.logs || []).length + ' ' + (LANG === 'ta' ? 'பதிவுகள்' : 'site log entr' + ((d.logs || []).length === 1 ? 'y' : 'ies')), 2)
    + tile('var(--amber)', L('queue'), String(waiting), '', 3) + '</div>';

  var due = dueToday();
  h += sec('☀️ ' + L('plan')) + '<div class="card">' + (due.length ? due.slice(0, 12).map(function(x){
    return '<div class="row"' + (x.cid ? ' data-cust="' + x.cid + '"' : '') + '><div class="ic">' + x.ic + '</div><div class="m"><b>' + esc(x.t) + '</b><small' + (x.late ? ' class="bad"' : '') + '>' + x.s + '</small></div>'
      + (x.a ? '<div class="a ' + (x.dir === 'in' ? 'good' : '') + '">' + rs(x.a) + '</div>' : '') + (x.ph ? tel(x.ph) : '') + '</div>'; }).join('') + (due.length > 12 ? '<div class="row"><small>+' + (due.length - 12) + '</small></div>' : '') : empty('🌤')) + '</div>';
  if((d.logs || []).length){
    h += sec(L('logs')) + '<div class="card">' + d.logs.map(function(l){ return '<div class="row"><div class="ic">📓</div><div class="m"><b>' + esc(l.c || '—') + '</b><small>' + esc(l.w || '') + (l.n ? ' · ' + l.n + ' 👷' : '') + '</small></div></div>'; }).join('') + '</div>';
  }
  if(s.leads){
    var ld = s.leads;
    h += sec('🎯 ' + L('leads'), '<a>' + (ld.open || 0) + ' ' + (LANG === 'ta' ? 'திறந்தவை' : 'open') + (ld.won != null ? ' · ' + ld.won + ' ' + (LANG === 'ta' ? 'வென்றவை' : 'won') : '') + '</a>');
    h += '<div class="card">' + ((ld.due || []).length ? ld.due.map(function(l){
      var late = l.next && l.next < todayIso();
      return '<div class="row"><div class="ic">🎯</div><div class="m"><b>' + esc(l.n) + '</b><small>' + esc([l.w, l.st].filter(Boolean).join(' · ')) + (l.next ? ' · <span class="' + (late ? 'bad' : '') + '">' + (LANG === 'ta' ? 'அழைக்க ' : 'call ') + fd(l.next) + '</span>' : '') + '</small></div>'
        + (l.val ? '<div class="a">' + short(l.val) + '</div>' : '') + tel(l.ph) + (l.ph && !RO() ? '<button class="btn wa sm" data-lead="' + esc(l.id) + '">💬</button>' : '') + '</div>'; }).join('') : empty('🎯')) + '</div>';
  }
  h += sec(L('cash'));
  var accs = c.accs || [], tot = accs.reduce(function(a, x){ return a + x.b; }, 0);
  h += '<div class="tiles">' + (accs.length ? tile('var(--lime)', LANG === 'ta' ? 'மொத்தம்' : 'Total cash + bank', short(tot), accs.map(function(a){ return esc(a.n) + ' ' + short(a.b); }).join(' · '), 0, true)
      : tile('var(--text3)', LANG === 'ta' ? 'கணக்குகள்' : 'Accounts', '—', LANG === 'ta' ? 'கணக்குகள் அமைக்கப்படவில்லை' : 'Set up Accounts → Cash & Bank on the computer', 0, true))
    + tile('var(--coral)', L('out7'), short(c.out7 || 0), '', 1) + tile('var(--mint)', L('in7'), short(c.in7 || 0), '', 2) + '</div>';
  h += flowChart(s);
  if((c.lines || []).length) h += '<div class="card" style="margin-top:10px">' + c.lines.slice(0, 8).map(function(l){ return '<div class="row"><div class="ic">' + (l.dir === 'in' ? '⬇' : '⬆') + '</div><div class="m"><b>' + esc(l.x) + '</b><small>' + fd(l.d) + (l.od ? ' · <span class="bad">' + L('late') + '</span>' : '') + '</small></div><div class="a ' + (l.dir === 'in' ? 'good' : 'bad') + '">' + rs(l.a) + '</div></div>'; }).join('') + '</div>';
  $('v-home').innerHTML = h;
  $('share-day').onclick = shareDay; $('calc-o').onclick = calcSheet;
  if($('per')) $('per').onclick = function(e){ var b = e.target.closest('button'); if(!b) return; LS.set('blo_per', b.getAttribute('data-p')); home(); };
}

  h += quotesCard(s);
  if(s.pl){

  if(s.pl) h += '<div class="btns" style="margin-top:12px"><button class="btn" id="share-month" style="flex:1">📄 ' + esc(L('monthrep')) + '</button></div>';

/* 4 + 6 · Sites: projects, stages, labour, stock, photos */
function projCard(p, i){
  var pct = Math.max(0, Math.min(100, Number(p.pct) || 0)), c = p.late ? 'var(--coral)' : p.used != null && p.used > 90 ? 'var(--amber)' : 'var(--mint)';

    + '<div class="bar" style="--c:' + c + '"><i style="width:' + pct + '%"></i></div>'
    + '<div class="btns">' + (p.used != null ? '<span class="pill' + (p.used > 100 ? ' bad' : '') + '">' + p.used + '% ' + L('budget') + '</span>' : '') + (p.late ? '<span class="pill bad">' + p.late + ' ' + L('late') + '</span>' : '') + (p.owed ? '<span class="pill">' + L('owes') + ' ' + short(p.owed) + '</span>' : '') + '</div></div>';
}
function stageRows(c){
  var t = todayIso();
  return c.s.map(function(st){ var bal = st.a - st.got, late = bal > 0.5 && st.due && st.due < t;
    return '<div class="stg"><span>' + (bal <= 0.5 ? '✅ ' : late ? '⚠️ ' : '⏳ ') + esc(st.n) + '</span><b class="' + (bal <= 0.5 ? 'good' : late ? 'bad' : '') + '">' + (bal <= 0.5 ? rs(st.a) : rs(bal) + ' ' + L('left')) + '</b>' + (st.due ? '<small>' + L('due') + ' ' + fd(st.due) + '</small>' : '') + '</div>'; }).join('');
}
function stageCard(c, i){
  var tot = c.s.reduce(function(a, x){ return a + x.a; }, 0), got = c.s.reduce(function(a, x){ return a + Math.min(x.a, x.got); }, 0);
  return '<div class="card tap" data-cust="' + c.cid + '" style="--i:' + i + '"><div class="row"><div class="ic">🧱</div><div class="m"><b>' + esc(c.n) + ' ›</b><small>' + rs(got) + ' / ' + rs(tot) + '</small></div><div class="a">' + (tot ? Math.round(got / tot * 100) : 0) + '%</div></div>'
    + '<div class="bar" style="--c:var(--lime)"><i style="width:' + (tot ? got / tot * 100 : 0).toFixed(1) + '%"></i></div>' + stageRows(c) + '</div>';
}
function sites(){

function pushBlock(){

}
function diagRun(){
  var rows = [], add = function(ok, t, s){ rows.push('<div class="row"><div class="ic">' + (ok === true ? '✅' : ok === false ? '❌' : '⏳') + '</div><div class="m"><b style="white-space:normal">' + esc(t) + '</b>' + (s ? '<small style="white-space:normal">' + esc(s) + '</small>' : '') + '</div></div>'); };
  var why = pushBlock(), mine = LS.get('blo_subid'), acked = mine && (SNAP.acks || []).indexOf(mine.id) >= 0, queued = mine && outbox().some(function(m){ return m.id === mine.id; });
  add(!!SNAP.vapid, L('d_pc'), SNAP.vapid ? '' : L('novapid'));
  add(!why, L('d_browser'), why);
  var perm = 'Notification' in window ? Notification.permission : 'default';
  if(!why) add(perm === 'granted' ? true : perm === 'denied' ? false : null, L('d_perm'), perm === 'granted' ? '' : perm === 'denied' ? L('blocked') : L('d_permask'));
  var done = function(reg, sub){
    if(!why){
      add(!!(reg && reg.active), L('d_sw'), reg && reg.active ? '' : L('swslow'));
      add(!!sub && sameKey(sub), L('d_sub'), !sub ? L('d_subno') : sameKey(sub) ? '' : L('d_subold'));
      add(acked ? true : mine ? null : false, L('d_got'), acked ? '' : queued ? L('d_queued') : mine ? L('d_wait') + ' ' + ago(mine.at) : L('d_subno'));
    }
    var last = (SNAP.alerts || []).slice(-1)[0];
    add(last ? true : null, L('d_last'), last ? last.t + ' · ' + ago(last.at) : L('d_none'));
    $('dg-l').innerHTML = rows.join('');
  };
  if(why || !('serviceWorker' in navigator)) return done(null, null);
  navigator.serviceWorker.getRegistration().then(function(reg){ return reg ? reg.pushManager.getSubscription().then(function(s){ done(reg, s); }) : done(null, null); }).catch(function(){ done(null, null); });
}

/* ── 12 · staying fresh, and offline ───────────────────────────────── */
function refresh(manual){
  if(!KEY || !CFG) return;
  if(manual) $('b-ref').innerHTML = '<span class="spin"></span>';
  fetchBlob().then(function(r){ return openBlob(r.b, KEY).then(function(s){ var first = !SNAP || s.at !== SNAP.at; if(first) show(s, r.live); else $('offline').classList.toggle('hide', r.live); }); })
    .catch(function(e){ if(e && e.message === 'gone'){ lock(); $('lk-msg').textContent = L('gone'); } }).then(function(){ $('b-ref').textContent = '⟳'; if(manual) toast('⟳ ' + L('upd') + ' ' + (SNAP ? ago(SNAP.at) : '')); });
}
var hiddenAt = 0;
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(KEY && LS.get('blo_lock') !== false && hiddenAt && Date.now() - hiddenAt > 5 * 60000){ lock(); return; }
  refresh(false);
});
window.addEventListener('online', function(){ refresh(false); flushOut(); });
setInterval(function(){ if(!document.hidden) refresh(false); }, 60000);

/* ── start ─────────────────────────────────────────────────────────── */
theme(); bigMode(); readLink(); padBuild();
LANG = LS.get('blo_lang') || 'en';
$('lk-bio').onclick = bioUnlock;
if(!CFG){
  $('lk-t').textContent = L('nolink'); $('lk-p').textContent = L('nolinkp'); $('pad').hidden = true; $('dots').hidden = true;
} else {
  $('lk-p').textContent = L('pin'); bioButton();
  if('serviceWorker' in navigator && window.isSecureContext) swReg().catch(function(){});
  if(LS.get('blo_lock') === false) kvGet('key').then(function(k){ if(!k) return; KEY = k; fetchBlob().then(function(r){ return openBlob(r.b, k).then(function(s){ show(s, r.live); }); }).catch(function(){ KEY = null; }); });
  else if(LS.get('blo_bio') && bioOk()) setTimeout(bioUnlock, 400);
}
window.BLO = {go:go, refresh:refresh, send:send, flushOut:flushOut, state:function(){ return {snap:SNAP, sent:SENT, out:outbox(), view:VIEW, lang:LANG}; }, lock:lock};
</script>
